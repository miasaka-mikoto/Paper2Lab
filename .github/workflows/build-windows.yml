name: Build Paper2Lab for Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build executable
        run: ./build_windows.ps1
        shell: pwsh
      - name: Smoke test CLI
        run: python -m paper2lab --self-test
      - name: Smoke test canonical service
        run: python -m paper2lab --service-self-test
      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $ui = Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE "dist\Paper2Lab.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($ui.ExitCode -ne 0) { throw "Frozen UI self-test failed: $($ui.ExitCode)" }
          $service = Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE "dist\Paper2Lab.exe") -ArgumentList "--service-self-test" -Wait -PassThru
          if ($service.ExitCode -ne 0) { throw "Frozen service self-test failed: $($service.ExitCode)" }
      - name: Upload Paper2Lab.exe
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Paper2Lab-windows
          path: dist/Paper2Lab.exe
